name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@e7fa5ac41e1cf5b7d48e45e42232ce7ada589601 # v9.1.0
        with:
          version: v2.6.2


  # Single required PR gate for CI (org CI-gate policy). Rolls up every job in
  # this file: needs them all, runs always(), and FAILS if any did not succeed
  # — so a skipped/failed job can't sneak through (skipped != success).
  checks-required:
    name: checks-required
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Check required CI jobs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          failed="$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')"
          if [[ -n "$failed" ]]; then
            echo "::error::required CI jobs did not all pass"
            echo "$failed"
            exit 1
          fi
